# Nombre:                 application.yml
# Descripción:            Configuración común a todos los perfiles: JPA en modo validación, sesión, i18n, Actuator y OpenAPI.
# Fecha de creación:      2026-10-14
# Fecha de actualización: 2026-10-15
# Autores:                Ana Sofía Nagles García, María Mercedes Rincón Valencia, Juan David Camacho Tapiero
# Versión:                0.2.0

spring:
  application:
    name: ferrestock-backend
  profiles:
    default: dev
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate          # el esquema lo crean los scripts de db/ (ADR-02)
    properties:
      hibernate.jdbc.time_zone: UTC
  messages:
    basename: i18n/mensajes
    encoding: UTF-8
    fallback-to-system-locale: false
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

server:
  port: ${PORT:8080}
  error:
    include-stacktrace: never
    include-message: never
  servlet:
    session:
      timeout: 30m
      cookie:
        name: FSSESSION
        http-only: true
        same-site: lax

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      show-components: never

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
  paths-to-match: /api/**

ferrestock:
  seguridad:
    swagger-publico: false
    intentos-maximos: 5          # RF-AUT-008 (propuesta aprobada)
    minutos-bloqueo: 15
    recuerdame-dias: 7           # RNF-SEG-04
    recuerdame-clave: ${FS_RECUERDAME_CLAVE:}
    cookies-seguras: false

spring:
  datasource:
    url: ${FS_DB_URL:jdbc:postgresql://localhost:5432/ferrestock}
    username: ${FS_DB_USUARIO:ferrestock_app}
    password: ${FS_DB_CLAVE:}

ferrestock:
  seguridad:
    swagger-publico: true

logging:
  level:
    com.ferrestock: DEBUG

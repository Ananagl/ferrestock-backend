spring:
  datasource:
    url: ${FS_DB_URL}
    username: ${FS_DB_USUARIO}
    password: ${FS_DB_CLAVE}

server:
  forward-headers-strategy: framework
  servlet:
    session:
      cookie:
        secure: true

ferrestock:
  seguridad:
    swagger-publico: false
